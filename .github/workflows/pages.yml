# Build and publish to GitHub Pages on every push to main.
# Needs: Settings → Pages → Source: "GitHub Actions", and a repo variable
# VITE_CHAT_SERVER (Settings → Secrets and variables → Actions → Variables).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require chat server
        env:
          VITE_CHAT_SERVER: ${{ vars.VITE_CHAT_SERVER }}
        run: |
          if [ -z "$VITE_CHAT_SERVER" ]; then
            echo "::error::Repo variable VITE_CHAT_SERVER is not set. The site would ship without chat."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_CHAT_SERVER: ${{ vars.VITE_CHAT_SERVER }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
